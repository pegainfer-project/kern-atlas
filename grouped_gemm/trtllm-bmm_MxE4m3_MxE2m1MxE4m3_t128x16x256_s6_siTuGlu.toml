notes = """
2026-11-16: no source upstream. NVIDIA's trtllm-gen generator emits the kernel; TensorRT-LLM ships the
cubin (git LFS, tar.zst) and the host side in trtllmGen_bmm_export/ (BatchedGemmInterface.h fills
KernelParamsDecl.h, TmaDescriptor.h); FlashInfer ships the same family through flashinfer-cubin.
One sm100f cubin for CC 10.0 and 10.3. Launch: 512 threads, cluster 2x1x1, ~223 KB shared memory,
persistent; rows gathered by TMA through the routing's permutation.
kern-k31's decode FC1 is FlashInfer's export of this tile with an f32 bias per row (biasFp32M),
flashinfer-cubin 0.6.18, TLLM_GEN_EXPORT_VERSION 7.0.4.0.4.0; this TensorRT-LLM commit has the tile only
without it.
Measured in kern-k31 413b06f's decode step on GB300 (experts EP2 x TP4: 448 experts a GPU, 768 of
each one's 3072 intermediate width; 3584-wide latent; real routing), 128 rows: 127 us a launch, ~5.8
TB/s of expert weights (~254 active experts a GPU by 2026-11-05's routing statistics) over the
kernel's span including its PDL wait.
2026-11-05: FlashInfer 0.6.13's tactic sweep on one GB300 (latent 3584, intermediate 3072, top-16 of
896, real routing, 16-256 rows, kern-k31 11c9b66): this tile with the FC2 at the same tile is the best
tactic at every size or within 0.5% of it; 8-row tiles tie at 16-64 rows. Splitting
each expert 4 ways (768 wide) costs the same per byte (0.98-1.02x, FC1 + FC2).
2026-11-16: source-available equivalent: grouped_gemm/flashinfer-prims_ts_batched_gemm.toml (FlashInfer Prims-TS).
"""
